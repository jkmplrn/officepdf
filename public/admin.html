<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OfficePDF — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--red:#E8372B;--red-dark:#c22d22;--red-light:#fdf1f0;--charcoal:#1a1a1a;--mid:#5a5a5a;--light:#f5f4f2;--border:#e0ddd8;--radius:14px;--fh:'DM Serif Display',serif;--fb:'DM Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--light);color:var(--charcoal);min-height:100vh}
nav{background:#fff;border-bottom:1px solid var(--border);height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo-box{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-box svg{width:18px;height:18px;fill:#fff}
.logo-name{font-family:var(--fh);font-size:1.3rem}
.nav-right{display:flex;gap:12px;align-items:center}
.nbtn{padding:8px 18px;border-radius:8px;font-family:var(--fb);font-size:.85rem;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--mid);text-decoration:none}
.nbtn:hover{border-color:var(--red);color:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:48px 32px}
.page-head{margin-bottom:32px}
.page-head h2{font-family:var(--fh);font-size:2rem;margin-bottom:8px}
.page-head p{color:var(--mid);font-size:.9rem}
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--border);padding:32px;margin-bottom:28px}
.card h3{font-family:var(--fh);font-size:1.3rem;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
label{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);display:block;margin-bottom:6px}
input,select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--fb);font-size:.9rem;background:#fafafa;outline:none}
input:focus,select:focus{border-color:var(--red);background:#fff}
.btn{padding:11px 24px;border-radius:8px;font-family:var(--fb);font-size:.9rem;font-weight:600;cursor:pointer;border:none}
.btn-pri{background:var(--red);color:#fff}
.btn-pri:hover{background:var(--red-dark)}
.btn-sm{padding:6px 14px;font-size:.8rem;border-radius:6px;cursor:pointer;font-family:var(--fb);font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--mid)}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.btn-del{border-color:#fca5a5;color:#dc2626}
.btn-del:hover{background:#fef2f2;border-color:#dc2626}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);padding:0 16px 12px;border-bottom:1.5px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:.88rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-flex;padding:3px 10px;border-radius:50px;font-size:.72rem;font-weight:600}
.badge.admin{background:#fdecea;color:var(--red)}
.badge.user{background:var(--light);color:var(--mid)}
.msg{padding:12px 16px;border-radius:8px;font-size:.85rem;font-weight:500;margin-top:12px;display:none}
.msg.ok{background:#edfaf4;color:#1a7a44;display:block}
.msg.err{background:#fdf0ef;color:var(--red);display:block}
.td-actions{display:flex;gap:8px}
@media(max-width:640px){.form-row,.form-row.triple{grid-template-columns:1fr}.wrap{padding:24px 16px}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/app">
    <div class="logo-box"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg></div>
    <span class="logo-name">OfficePDF</span>
  </a>
  <div class="nav-right">
    <a href="/app" class="nbtn">← Back to App</a>
    <button class="nbtn" id="signout-btn">Sign out</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <h2>Admin Panel</h2>
    <p>Manage user accounts and access.</p>
  </div>

  <!-- Add user -->
  <div class="card">
    <h3>Add New User</h3>
    <div class="form-row triple">
      <div><label>Username</label><input id="new-username" type="text" placeholder="e.g. john.doe" spellcheck="false"/></div>
      <div><label>Password</label><input id="new-password" type="password" placeholder="Min. 6 characters"/></div>
      <div><label>Role</label>
        <select id="new-role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <button class="btn btn-pri" id="add-btn">Add User</button>
    <div class="msg" id="add-msg"></div>
  </div>

  <!-- Change own password -->
  <div class="card">
    <h3>Change My Password</h3>
    <div class="form-row">
      <div><label>Current Password</label><input id="cur-pass" type="password" placeholder="Current password"/></div>
      <div><label>New Password</label><input id="new-pass" type="password" placeholder="New password (min. 6 chars)"/></div>
    </div>
    <button class="btn btn-pri" id="chpass-btn">Change Password</button>
    <div class="msg" id="chpass-msg"></div>
  </div>

  <!-- Users table -->
  <div class="card">
    <h3>All Users</h3>
    <table>
      <thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody id="users-tbody"><tr><td colspan="4" style="color:var(--mid);text-align:center;padding:24px">Loading...</td></tr></tbody>
    </table>
    <div class="msg" id="table-msg"></div>
  </div>
</div>

<!-- Reset password modal -->
<div id="reset-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:32px;max-width:400px;width:90%">
    <h3 style="font-family:var(--fh);margin-bottom:16px">Reset Password</h3>
    <p style="color:var(--mid);font-size:.88rem;margin-bottom:16px">Set a new password for <strong id="reset-uname"></strong></p>
    <label>New Password</label>
    <input id="reset-pass" type="password" placeholder="Min. 6 characters" style="margin-top:8px;margin-bottom:16px"/>
    <div style="display:flex;gap:12px">
      <button class="btn btn-pri" id="reset-confirm-btn" style="flex:1">Reset Password</button>
      <button class="btn" id="reset-cancel-btn" style="flex:1;background:var(--light);color:var(--mid);border:1.5px solid var(--border)">Cancel</button>
    </div>
    <div class="msg" id="reset-msg"></div>
  </div>
</div>

<script>
(function(){
  var resetUserId = null;

  function showMsg(id, type, text){ var el=document.getElementById(id); el.className='msg '+type; el.textContent=text; setTimeout(function(){ el.className='msg'; }, 4000); }

  function loadUsers(){
    fetch('/admin/users').then(function(r){ return r.json(); }).then(function(users){
      var tbody = document.getElementById('users-tbody');
      if(!users.length){ tbody.innerHTML='<tr><td colspan="4" style="color:var(--mid);text-align:center;padding:24px">No users yet.</td></tr>'; return; }
      tbody.innerHTML = users.map(function(u){
        var date = new Date(u.created_at).toLocaleDateString();
        return '<tr>'+
          '<td><strong>'+u.username+'</strong></td>'+
          '<td><span class="badge '+u.role+'">'+u.role+'</span></td>'+
          '<td style="color:var(--mid)">'+date+'</td>'+
          '<td><div class="td-actions">'+
            '<button class="btn-sm" onclick="openReset('+u.id+',\''+u.username+'\')">Reset Password</button>'+
            '<button class="btn-sm btn-del" onclick="deleteUser('+u.id+',\''+u.username+'\')">Delete</button>'+
          '</div></td>'+
        '</tr>';
      }).join('');
    });
  }

  document.getElementById('add-btn').addEventListener('click', function(){
    var u = document.getElementById('new-username').value.trim();
    var p = document.getElementById('new-password').value;
    var r = document.getElementById('new-role').value;
    if(!u||!p){ showMsg('add-msg','err','Username and password are required.'); return; }
    fetch('/admin/users',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p,role:r}) })
    .then(function(res){ return res.json().then(function(d){ return {ok:res.ok,data:d}; }); })
    .then(function(res){
      if(res.ok){ showMsg('add-msg','ok','User "'+u+'" added successfully.'); document.getElementById('new-username').value=''; document.getElementById('new-password').value=''; loadUsers(); }
      else { showMsg('add-msg','err',res.data.error||'Failed to add user.'); }
    });
  });

  document.getElementById('chpass-btn').addEventListener('click', function(){
    var c = document.getElementById('cur-pass').value;
    var n = document.getElementById('new-pass').value;
    if(!c||!n){ showMsg('chpass-msg','err','Both fields are required.'); return; }
    fetch('/auth/change-password',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({currentPassword:c,newPassword:n}) })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
    .then(function(res){
      if(res.ok){ showMsg('chpass-msg','ok','Password changed successfully.'); document.getElementById('cur-pass').value=''; document.getElementById('new-pass').value=''; }
      else { showMsg('chpass-msg','err',res.data.error||'Failed to change password.'); }
    });
  });

  window.openReset = function(id, username){
    resetUserId = id;
    document.getElementById('reset-uname').textContent = username;
    document.getElementById('reset-pass').value = '';
    document.getElementById('reset-overlay').style.display = 'flex';
  };

  document.getElementById('reset-cancel-btn').addEventListener('click', function(){ document.getElementById('reset-overlay').style.display='none'; });

  document.getElementById('reset-confirm-btn').addEventListener('click', function(){
    var p = document.getElementById('reset-pass').value;
    if(!p){ showMsg('reset-msg','err','Please enter a new password.'); return; }
    fetch('/admin/users/'+resetUserId+'/reset-password',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({newPassword:p}) })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
    .then(function(res){
      if(res.ok){ document.getElementById('reset-overlay').style.display='none'; showMsg('table-msg','ok','Password reset successfully.'); }
      else { showMsg('reset-msg','err',res.data.error||'Failed to reset password.'); }
    });
  });

  window.deleteUser = function(id, username){
    if(!confirm('Delete user "'+username+'"? This cannot be undone.')) return;
    fetch('/admin/users/'+id,{ method:'DELETE' })
    .then(function(r){ return r.json(); })
    .then(function(){ showMsg('table-msg','ok','User "'+username+'" deleted.'); loadUsers(); });
  };

  document.getElementById('signout-btn').addEventListener('click', function(){
    fetch('/auth/logout',{method:'POST'}).then(function(){ window.location.href='/'; });
  });

  loadUsers();
})();
</script>
</body>
</html>
